version: "3.8"

services:
  quant:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - quant_strategies:/app/data
    environment:
      - NODE_ENV=production
      - STRATEGIES_DB_PATH=/app/data/strategies_db.json
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  quant_strategies:
  redis_data: